name: Build HTML5

on:
  workflow_dispatch:
  push:
    paths:
      - "source/**"
      - "assets/**"
      - "Project.xml"
      - ".github/workflows/html5.yml"

permissions:
  contents: read

jobs:
  build-html5:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.1.5"

      - name: Set up Haxelib
        run: haxelib setup ~/haxelib

      - name: Install compatible Lime/OpenFL
        run: |
          haxelib install lime 7.9.0
          haxelib install openfl 9.2.2

      - name: Install legacy Kade Engine dependencies
        run: |
          haxelib install flixel 4.11.0
          haxelib install flixel-addons 2.11.0
          haxelib install hscript 2.4.0
          haxelib install actuate 1.8.7
          haxelib install flixel-ui 2.5.0
          haxelib install newgrounds 1.1.5
          haxelib install polymod 1.4.1
          haxelib git extension-webm https://github.com/KadeDev/extension-webm.git

      - name: Build HTML5
        run: haxelib run lime build html5 -release

      - name: Upload HTML5 build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Monday-Dusk-Monolith-HTML5
          path: export/html5/bin/
          if-no-files-found: warn
          retention-days: 14
